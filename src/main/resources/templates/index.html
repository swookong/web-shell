<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Shell - Linux 远程终端</title>
    <link rel="shortcut icon" th:href="@{/static/img/favicon.ico}"/>
    <link rel="stylesheet" href="/static/css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/static/css/xterm.css}"/>
    <link rel="stylesheet" th:href="@{/static/css/webShell.css}"/>
    <script type="text/javascript" th:src="@{/static/js/xterm.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/jquery-3.5.1.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/bootstrap/bootstrap.bundle.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/web-socket.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/crypto-js.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/web-shell.js}"></script>
</head>
<body>

<div id="login" class="login-overlay d-flex align-items-center justify-content-center">
    <div class="login-card shadow-lg">
        <div class="login-header text-center">
            <div class="logo-icon">
                <i class="bi bi-terminal-fill"></i>
            </div>
            <h2 class="mb-1">Web Shell</h2>
            <p class="text-muted small">连接 Linux 远程主机</p>
        </div>
        <form action="#" class="login-form" onsubmit="login()">
            <div class="mb-3">
                <label for="host" class="form-label">
                    <i class="bi bi-hdd-network me-1"></i>主机地址
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-globe"></i></span>
                    <input type="text" class="form-control" id="host" required="required"
                           placeholder="例如: 192.168.1.10" value="127.0.0.1"/>
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-8">
                    <label for="username" class="form-label">
                        <i class="bi bi-person me-1"></i>用户名
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control" id="username" value="root" required="required"
                               placeholder="root"/>
                    </div>
                </div>
                <div class="col-4">
                    <label for="port" class="form-label">
                        <i class="bi bi-plug me-1"></i>端口
                    </label>
                    <input type="number" class="form-control" id="port" value="22" required="required"
                           placeholder="22"/>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="bi bi-lock me-1"></i>密码
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" required="required"
                           placeholder="请输入密码"/>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword(this)">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
            </div>
            <button class="btn btn-primary w-100 login-btn" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i>连接
            </button>
        </form>
        <div class="login-footer text-center">
            <small class="text-muted">SSH over WebSocket - 端到端加密</small>
        </div>
    </div>
</div>

<div id="menu" class="top-menu-bar d-none">
    <div class="d-flex align-items-center h-100 px-3 gap-2">
        <span class="brand-name"><i class="bi bi-terminal me-1"></i>Web Shell</span>
        <span class="conn-badge ms-2"><i class="bi bi-wifi"></i> <span id="connHost"></span></span>
        <div class="ms-auto d-flex gap-2">
            <button class="btn btn-sm btn-outline-light" onclick="loginSftp()">
                <i class="bi bi-folder2-open me-1"></i>SFTP 文件管理
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="disconnect()">
                <i class="bi bi-box-arrow-right me-1"></i>断开
            </button>
        </div>
    </div>
</div>

<div id="terminal" class="indexContainer"></div>

<div class="modal fade" id="disconnectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title"><i class="bi bi-box-arrow-right me-2 text-danger"></i>确认断开</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body pt-4 pb-2 text-center">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:2.5rem;"></i>
                <p class="mt-3 mb-0">确定要断开当前 SSH 连接吗？</p>
                <small class="text-muted">断开后 SFTP 文件管理也将无法使用</small>
            </div>
            <div class="modal-footer border-0 pt-2 justify-content-center">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDisconnectBtn">
                    <i class="bi bi-box-arrow-right me-1"></i>确认断开
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword(btn) {
        var input = document.getElementById('password');
        var icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye-slash';
        }
    }

    var bc = new BroadcastChannel('web-shell-session');

    var disconnectModal = new bootstrap.Modal(document.getElementById('disconnectModal'));

    function disconnect() {
        disconnectModal.show();
    }

    document.getElementById('confirmDisconnectBtn').addEventListener('click', function () {
        disconnectModal.hide();
        client.disconnect();
        bc.postMessage({ type: 'session-closed' });
        $("#login").removeClass("d-none").addClass("d-flex");
        $("body").removeClass("menu-active");
        $("#menu").addClass("d-none");
    });

    $(document).ready(function () {
        var url = window.location.href;
        if (!url.endsWith('/?#')) {
            window.location.href = url + '?#';
        }
        var num1 = Math.round(Math.random() * 360);
        var num2 = Math.round(Math.random() * 360);
        document.documentElement.style.setProperty('--grad-a', 'hsl(' + num1 + ', 70%, 65%)');
        document.documentElement.style.setProperty('--grad-b', 'hsl(' + num2 + ', 70%, 55%)');
    })

    var rows = document.querySelector(".indexContainer").offsetHeight / 16 - 5;
    var cols = document.querySelector(".indexContainer").offsetWidth / 9;
    var term = new Terminal({
        rendererType: "canvas",
        pid: 1,
        name: 'terminal',
        rows: parseInt(rows),
        cols: parseInt(cols),
        convertEol: true,
        scrollback: 500,
        disableStdin: false,
        cursorStyle: 'underline',
        cursorBlink: true,
        tabStopWidth: 8,
        screenKeys: true,
        theme: {
            foreground: '#58a6ff',
            background: '#1e1e2e',
            cursor: "#f9e2af",
            lineHeight: 16
        }
    });

    term.write('Hello from \x1B[1;3;31mxterm.js\x1B[0m $ ')
    term.prompt = function () { term.write("\r\n$ "); };

    var client = new WebSocketClient();

    function connect(params, divId) {
        term.open(document.getElementById(divId), true);
        term.clear();
        term.write('\r\nConnecting...');
        client.connect({
            onError: function (error) {
                term.write('Error: ' + error + '\r\n');
            },
            onConnect: function () {
                client.send(params);
                $("body").addClass("menu-active");
                $("#login").addClass("d-none").removeClass("d-flex");
                $("#menu").removeClass("d-none");
                $("#connHost").text(params.host);
            },
            onClose: function () {
                term.write("\r\nConnection closed\r\n");
                $("#login").removeClass("d-none").addClass("d-flex");
                $("body").removeClass("menu-active");
                $("#menu").addClass("d-none");
            },
            onData: function (data) {
                term.write(data);
            }
        });
    }

    var params = {
        operate: 'connect',
        host: '',
        port: '22',
        username: '',
        password: ''
    }

    var loginParams = {};

    function login() {
        var params = {
            operate: 'connect',
            host: $("#host").val(),
            port: $("#port").val(),
            username: $("#username").val(),
            password: encrypt($("#password").val())
        }
        loginParams = params;
        document.title += " " + params.host;
        connect(params, 'terminal')
    }

    function loginSftp() {
        if (!loginParams || !loginParams.host) {
            alert('请先登录服务器！');
            return;
        }
        var paramsStr = JSON.stringify(loginParams);
        var url = window.location.origin + '/sftp?params=' + encodeURIComponent(paramsStr);
        window.open(url, "_blank");
    }

    var selection;
    term.onData(function (e) {
        client.sendClientData(e);
    });
    term.onResize(function (size) {
        cols = size.cols;
        rows = size.rows;
        term.scrollToBottom();
        client.send({operate: "resize", cols: cols, rows: rows});
    });
    term.onSelectionChange(function () {
        if (term.hasSelection()) {
            selection = term.getSelection();
        }
    });
    term.attachCustomKeyEventHandler(function (ev) {
        if (ev.keyCode === 86 && ev.ctrlKey) {
            client.sendClientData("\x00" + selection);
            selection = "";
        }
    });
</script>
</body>
</html>
