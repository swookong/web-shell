<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="'Web SFTP - ' + ${host}">Web SFTP</title>
    <link rel="shortcut icon" th:href="@{/static/img/favicon.ico}" />
    <link rel="stylesheet" href="/static/css/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/static/css/jstree/style.min.css}" />
    <link rel="stylesheet" th:href="@{/static/css/webShell.css}" />
    <script type="text/javascript" th:src="@{/static/js/jquery-3.5.1.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/bootstrap/bootstrap.bundle.min.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/web-socket.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/web-shell.js}"></script>
    <script type="text/javascript" th:src="@{/static/js/jstree.min.js}"></script>
</head>

<body class="sftp-body">

    <nav class="navbar navbar-dark bg-sftp-nav">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-folder2-open me-2"></i>Web SFTP 文件管理器
            </span>
            <div class="d-flex align-items-center gap-2">
                <span class="host-badge"><i class="bi bi-hdd-network"></i> <span th:text="${host}">host</span></span>
                <button type="button" class="btn btn-sm btn-outline-light" onclick="window.close()">
                    <i class="bi bi-x-lg me-1"></i>关闭
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid sftp-main p-3">
        <div class="row g-3 h-100">
            <div class="col-12 col-md-4 sftp-tree-col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-white py-2 px-3 border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-folder text-primary"></i>
                            <span class="fw-semibold text-dark">目录树</span>
                            <button class="btn btn-sm btn-outline-secondary ms-auto" onclick="refreshTree()" title="刷新">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div class="mb-3">
                            <label class="form-label small text-muted mb-1"><i
                                    class="bi bi-folder2 me-1"></i>当前路径</label>
                            <input id="current_path" class="form-control form-control-sm" placeholder="当前目录"
                                value="/" />
                        </div>
                        <form action="#" enctype="multipart/form-data" id="upload_form" class="mb-3">
                            <input type="hidden" name="path" id="path">
                            <label class="upload-btn">
                                <i class="bi bi-cloud-upload me-1"></i>选择文件上传
                                <input type="file" name="file" id="file" multiple hidden>
                            </label>
                        </form>
                        <div id="file_tree" class="sftp-file-tree"></div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-8 sftp-detail-col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-white py-2 px-3 border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-list-ul text-primary"></i>
                            <span class="fw-semibold text-dark">文件列表</span>
                        </div>
                    </div>
                    <div class="card-body p-0 overflow-hidden">
                        <div class="table-responsive h-100">
                            <table class="table table-hover align-middle mb-0 sftp-table">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th><i class="bi bi-file-earmark me-1"></i>文件名</th>
                                        <th><i class="bi bi-file-earmark-text me-1"></i>类型</th>
                                        <th><i class="bi bi-key me-1"></i>权限</th>
                                        <th>链接</th>
                                        <th>所有者</th>
                                        <th>组</th>
                                        <th><i class="bi bi-hdd me-1"></i>大小</th>
                                        <th>修改时间</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="message_console" class="sftp-message-console"></div>

    <script th:inline="javascript">
        (function () {
            var bc = new BroadcastChannel('web-shell-session');
            bc.onmessage = function (e) {
                if (e.data && e.data.type === 'session-closed') {
                    redirectToLogin();
                }
            };
        })();

        $(function () {
            var url = window.location.href;
            var urlParams = window.location.search;
            history.replaceState(null, null, url.replace(urlParams, ""))
            var login = [[${ login }]];
            if (!login && window.confirm("登录失败，请重新连接SFTP服务！")) {
                window.opener = null;
                window.open('', '_self');
                window.close();
            }
            $("#file").change(function () {
                if ($(this).val() !== "") {
                    uploadFile();
                }
            })
            function getFileTree(instance, selectedNode) {
                $.ajax({
                    url: "/sftp/getFileTree",
                    dataType: "json",
                    data: { 'path': selectedNode.id },
                    type: "get",
                    success: function (res) {
                        console.info(res);
                        checkErr(res)
                        var fileTree = res.data
                        if (fileTree && fileTree.length > 0) {
                            selectedNode.children = [];
                            for (var i in fileTree) {
                                var item = fileTree[i];
                                instance.create_node(selectedNode, item, "last");
                            }
                            instance.open_node(selectedNode);
                            instance.deselect_all();
                            loadTableData(fileTree);
                        } else {
                            showTips("暂无数据！");
                            $(".file-detail-table .data-cell").remove();
                        }
                    }
                });
            }
            var $fileTree = $('#file_tree');
            var $currentPathInput = $("#current_path");
            function getFileIcon(name) {
                var ext = (name && name.indexOf('.') >= 0 ? name.split('.').pop() : '').toLowerCase();
                var m = {
                    sh: ['bi-filetype-sh', 'text-success'], bash: ['bi-filetype-sh', 'text-success'],
                    py: ['bi-filetype-py', 'text-primary'], js: ['bi-filetype-js', 'text-warning'],
                    java: ['bi-filetype-java', 'text-danger'], php: ['bi-filetype-php', 'text-secondary'],
                    rb: ['bi-filetype-rb', 'text-danger'], cs: ['bi-filetype-cs', 'text-primary'],
                    html: ['bi-filetype-html', 'text-warning'], htm: ['bi-filetype-html', 'text-warning'],
                    css: ['bi-filetype-css', 'text-primary'], scss: ['bi-filetype-css', 'text-primary'],
                    json: ['bi-filetype-json', 'text-warning'], yml: ['bi-filetype-yml', 'text-secondary'],
                    yaml: ['bi-filetype-yml', 'text-secondary'], xml: ['bi-filetype-xml', 'text-primary'],
                    md: ['bi-filetype-md', 'text-info'], markdown: ['bi-filetype-md', 'text-info'],
                    sql: ['bi-filetype-sql', 'text-primary'], txt: ['bi-filetype-txt', 'text-muted'],
                    log: ['bi-file-earmark-text', 'text-muted'],
                    conf: ['bi-file-earmark-code', 'text-secondary'], cfg: ['bi-file-earmark-code', 'text-secondary'],
                    ini: ['bi-file-earmark-code', 'text-secondary'], properties: ['bi-file-earmark-code', 'text-secondary'],
                    gz: ['bi-file-earmark-zip', 'text-warning'], tar: ['bi-file-earmark-zip', 'text-warning'],
                    zip: ['bi-file-earmark-zip', 'text-warning'], bz2: ['bi-file-earmark-zip', 'text-warning'],
                    xz: ['bi-file-earmark-zip', 'text-warning'], '7z': ['bi-file-earmark-zip', 'text-warning'],
                    rar: ['bi-file-earmark-zip', 'text-warning'], iso: ['bi-file-earmark-zip', 'text-secondary'],
                    deb: ['bi-file-earmark-zip', 'text-danger'], rpm: ['bi-file-earmark-zip', 'text-danger'],
                    png: ['bi-file-earmark-image', 'text-info'], jpg: ['bi-file-earmark-image', 'text-info'],
                    jpeg: ['bi-file-earmark-image', 'text-info'], gif: ['bi-file-earmark-image', 'text-info'],
                    svg: ['bi-file-earmark-image', 'text-info'], ico: ['bi-file-earmark-image', 'text-info'],
                    bmp: ['bi-file-earmark-image', 'text-info'],
                    pdf: ['bi-file-earmark-pdf', 'text-danger'],
                    doc: ['bi-file-earmark-word', 'text-primary'], docx: ['bi-file-earmark-word', 'text-primary'],
                    xls: ['bi-file-earmark-excel', 'text-success'], xlsx: ['bi-file-earmark-excel', 'text-success'],
                    ppt: ['bi-file-earmark-ppt', 'text-warning'], pptx: ['bi-file-earmark-ppt', 'text-warning'],
                    mp3: ['bi-file-earmark-music', 'text-secondary'], wav: ['bi-file-earmark-music', 'text-secondary'],
                    flac: ['bi-file-earmark-music', 'text-secondary'],
                    mp4: ['bi-file-earmark-play', 'text-secondary'], avi: ['bi-file-earmark-play', 'text-secondary'],
                    mkv: ['bi-file-earmark-play', 'text-secondary'], mov: ['bi-file-earmark-play', 'text-secondary'],
                    ttf: ['bi-file-earmark-font', 'text-secondary'], woff: ['bi-file-earmark-font', 'text-secondary'],
                    woff2: ['bi-file-earmark-font', 'text-secondary'], otf: ['bi-file-earmark-font', 'text-secondary'],
                    key: ['bi-filetype-key', 'text-warning'], pub: ['bi-filetype-key', 'text-warning'],
                    pem: ['bi-filetype-key', 'text-warning'], crt: ['bi-filetype-key', 'text-warning'],
                    exe: ['bi-file-earmark-binary', 'text-secondary'], bin: ['bi-file-earmark-binary', 'text-secondary'],
                    so: ['bi-file-earmark-binary', 'text-secondary'], dll: ['bi-file-earmark-binary', 'text-secondary']
                };
                if (m[ext]) return { cls: m[ext][0], color: m[ext][1] };
                return { cls: 'bi-file-earmark', color: 'text-secondary' };
            }
            function getFileTypeBadge(t) {
                var m = { '目录': 'ft-dir', '普通文件': 'ft-file', '链接文件': 'ft-link', '块设备文件': 'ft-block', '字符设备文件': 'ft-char', '套接字文件': 'ft-sock', '管理文件': 'ft-pipe' };
                return 'ft-badge ' + (m[t] || 'ft-file');
            }
            function loadTableData(data) {
                var fileDetail = "";
                $(".sftp-table tbody").empty();
                if (data[0].id.substring(1).indexOf('/') > 0) {
                    var id = data[0].id;
                    var pid = id.substring(0, id.lastIndexOf('/', id.lastIndexOf('/') - 1) + 1).replace(/(\/*$)/g, "") || '/';
                    fileDetail = "<tr class='data-cell parent-row'><td class='file-name jstree-default' id='" + pid + "'>" +
                        "<i class='bi bi-arrow-left file-ic text-primary'></i><span class='file-name-text'>..</span></td><td>上级目录</td>" +
                        "<td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>";
                }
                for (var d in data) {
                    var item = data[d];
                    var icon = item.icon;
                    var displayIcon = '';
                    if (icon === 'jstree-folder') {
                        displayIcon = '<i class="bi bi-folder-fill file-ic text-warning"></i>';
                    } else if (icon && !icon.startsWith('jstree')) {
                        displayIcon = "<i class='bi bi-file-earmark-image file-ic' style='background-image:url(" + icon + ");background-size:auto;background-position:center;background-repeat:no-repeat'></i>";
                    } else {
                        var fi = getFileIcon(item.text);
                        displayIcon = '<i class="bi ' + fi.cls + ' file-ic ' + fi.color + '"></i>';
                    }
                    fileDetail += "<tr class='data-cell'>";
                    fileDetail += "<td class='file-name jstree-default' id='" + item.id + "'>" +
                        displayIcon + "<span class='file-name-text'>" + item.text + "</span></td>";
                    fileDetail += "<td><span class='" + getFileTypeBadge(item.fileType) + "'>" + item.fileType + "</span></td>";
                    fileDetail += "<td class='mono'>" + item.fileAttr + "</td>";
                    fileDetail += "<td>" + item.numberOfDir + "</td>";
                    fileDetail += "<td>" + item.owner + "</td>";
                    fileDetail += "<td>" + item.group + "</td>";
                    fileDetail += "<td><span class='size-cell'>" + item.size + "</span></td>";
                    fileDetail += "<td class='modified-cell'>" + item.modifiedDate + "</td>";
                    fileDetail += "<td class='text-center'>" +
                        "<button class='delete-data' value='" + item.id + "'>" +
                        "<i class='bi bi-trash'></i></button>" +
                        "</td></tr>";
                }
                $(".sftp-table tbody").append(fileDetail);
                $('.data-cell .file-name').bind('click', function () {
                    var tree = $fileTree.jstree(true);
                    var val = $(this).attr('id');
                    var file = tree.get_node(val)
                    if (file && "jstree-folder" === file.icon) {
                        $currentPathInput.val(val)
                        tree.select_node(val);
                    }
                    $currentPathInput.focus()
                }).bind('dblclick', function () {
                    var tree = $fileTree.jstree(true);
                    var val = $(this).attr('id');
                    var file = tree.get_node(val)
                    if (file && "jstree-folder" !== file.icon) {
                        downloadFile(val);
                    }
                });

                $('.delete-data').bind('click', function () {
                    var val = $(this).attr("value");
                    if (window.confirm('确定要删除 "' + val + '" 吗？')) {
                        $.ajax({
                            url: "/sftp",
                            type: "delete",
                            dataType: "json",
                            data: { path: val },
                            success: function (res) {
                                if (checkErr(res)) {
                                    refreshTree();
                                }
                            }
                        });
                    }
                });
            }

            var rootDirectory = { "id": "/", "parent": "#", "text": "/", "icon": "jstree-folder", 'state': { 'opened': true } }

            $fileTree.on("changed.jstree", function (e, data) {
                if (data.selected.length) {
                    var selected = data.instance.get_node(data.selected[0])
                    console.log('The selected node is: ' + selected.id);
                    $currentPathInput.val(selected.id)
                    if ("jstree-folder" === selected.icon) {
                        getFileTree(data.instance, selected)
                    }
                }
            }).jstree({
                "core": {
                    "multiple": false,
                    'check_callback': true,
                    'data': function (obj, callback) {
                        $.ajax({
                            url: "/sftp/getFileTree",
                            dataType: "json",
                            data: { path: '/' },
                            type: "get",
                            success: function (res) {
                                checkErr(res)
                                var fileTree = res.data
                                if (fileTree) {
                                    loadTableData(fileTree);
                                    fileTree.unshift(rootDirectory)
                                    callback.call(this, fileTree);
                                } else {
                                    showTips("暂无数据！");
                                    $(".file-detail-table .data-cell").remove();
                                }
                            }
                        });
                    }
                },
                "plugins": []
            });

            function selectNode(nodeId, pNodeId) {
                var tree = $fileTree.jstree(true);
                if (tree.get_node(nodeId)) {
                    tree.select_node(nodeId);
                    return true;
                } else if (pNodeId && tree.get_node(pNodeId)) {
                    tree.select_node(pNodeId);
                    if (nodeId !== pNodeId) {
                        $currentPathInput.val(nodeId)
                        $currentPathInput.focus()
                        setTimeout(function () {
                            selectNode(nodeId);
                        }, 1000)
                    }
                    return true;
                } else {
                    return selectNode(nodeId, nodeId.substring(0, nodeId.lastIndexOf('/')))
                }
            }
            $currentPathInput.bind("keypress", function (event) {
                if (event.keyCode === 13) {
                    var val = $(this).val().replace(/(\/*$)/g, "");
                    console.log(val)
                    if (val) {
                        selectNode(val);
                    }
                }
            })

            function downloadFile(path) {
                fetch("/sftp/download?path=" + encodeURIComponent(path))
                    .then(function (response) {
                        if (response.status === 401) {
                            redirectToLogin();
                            return;
                        }
                        if (!response.ok) {
                            showTips("下载失败！HTTP " + response.status);
                            return;
                        }
                        var fileName = path.substring(path.lastIndexOf('/') + 1);
                        response.blob().then(function (blob) {
                            var url = URL.createObjectURL(blob);
                            var a = document.createElement('a');
                            a.href = url;
                            a.download = fileName;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        });
                    })
                    .catch(function () {
                        showTips("下载失败！网络错误");
                    });
            }
        });
    </script>
</body>

</html>
